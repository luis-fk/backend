name: News podcast

# Runs by hand only. The daily episode runs on a Railway cron service (see
# backend/news_podcast/README.md), because GitHub delays scheduled runs by hours or
# drops them.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "O que rodar"
        type: choice
        options:
          - episode
          - chat-id
        default: episode

concurrency:
  group: news-podcast

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  news-podcast:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SECRET_KEY: news-podcast-dummy-secret-key
      API_TOKEN_SECRET: news-podcast-dummy-api-token-secret
      ESP32_DEVICE_KEY: news-podcast-dummy-device-key
      OPEN_WEATHER_API_KEY: dummy
      ENVIRONMENT: development
      NGROK_URL: http://localhost
      SERVER_URL: http://localhost
      FRONT_END_URL: http://localhost:3000
      REDIS_URL: redis://localhost:6379
      AUTH_DATABASE_URL: sqlite:///dummy.db
      PLANTS_DATABASE_URL: sqlite:///dummy.db
      POLITICAL_CULTURE_DATABASE_URL: sqlite:///dummy.db
      CFFLCH_DATABASE_URL: sqlite:///dummy.db
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      NEWS_PODCAST_MINUTES: ${{ vars.NEWS_PODCAST_MINUTES }}
      NEWS_PODCAST_SPEECH_SPEED: ${{ vars.NEWS_PODCAST_SPEECH_SPEED }}
      ACTION: ${{ inputs.action }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Run
        run: uv run python manage.py news_podcast "$ACTION"

      - name: Keep debug files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: news-podcast-debug
          path: |
            backend/news_podcast_output/selection.json
            backend/news_podcast_output/script.json
          retention-days: 3
          if-no-files-found: ignore
