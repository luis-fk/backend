name: News podcast

on:
  schedule:
    # 06:10 in Brasília; NEWS_CUTOFF and SEND_AT in config.py depend on it.
    - cron: "10 9 * * *"
  workflow_dispatch:

concurrency:
  group: news-podcast

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  news-podcast:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SECRET_KEY: news-podcast-dummy-secret-key
      OPEN_WEATHER_API_KEY: dummy
      ENVIRONMENT: development
      NGROK_URL: http://localhost
      SERVER_URL: http://localhost
      FRONT_END_URL: http://localhost:3000
      REDIS_URL: redis://localhost:6379
      AUTH_DATABASE_URL: sqlite:///dummy.db
      PLANTS_DATABASE_URL: sqlite:///dummy.db
      POLITICAL_CULTURE_DATABASE_URL: sqlite:///dummy.db
      CFFLCH_DATABASE_URL: sqlite:///dummy.db
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SCHEDULED_FLAG: ${{ github.event_name == 'schedule' && '--scheduled' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Run
        run: uv run python manage.py news_podcast $SCHEDULED_FLAG

      - name: Keep debug files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: news-podcast-debug
          path: |
            backend/news_podcast_output/selection.json
            backend/news_podcast_output/script.json
          retention-days: 3
          if-no-files-found: ignore
