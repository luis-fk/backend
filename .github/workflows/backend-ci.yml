name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
      SECRET_KEY: ci-dummy-secret-key
      API_TOKEN_SECRET: ci-dummy-api-token-secret-at-least-32-chars
      OPEN_WEATHER_API_KEY: dummy
      OPENAI_API_KEY: dummy
      ENVIRONMENT: development
      NGROK_URL: http://localhost
      SERVER_URL: http://localhost
      FRONT_END_URL: http://localhost:3000
      REDIS_URL: redis://localhost:6379
      AUTH_DATABASE_URL: sqlite:///dummy.db
      PLANTS_DATABASE_URL: sqlite:///dummy.db
      POLITICAL_CULTURE_DATABASE_URL: sqlite:///dummy.db
      CFFLCH_DATABASE_URL: sqlite:///dummy.db
      NEWS_PODCAST_DATABASE_URL: sqlite:///dummy.db
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy .

      - name: Tests
        run: uv run pytest
