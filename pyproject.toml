[project]
name = "backend"
version = "2.1.1"
description = ""
authors = [{ name = "fl-korbes", email = "felipekorbes@live.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django==6.0.5",
    "gunicorn==26.0.0",
    "django-environ==0.13.0",
    "djangorestframework==3.17.1",
    "django-cors-headers==4.9.0",
    "langchain==1.2.18",
    "langgraph==1.1.10",
    "langchain-community==0.4.1",
    "tavily-python==0.7.24",
    "langchain-openai==1.2.1",
    "psycopg2-binary==2.9.12",
    "dj-database-url==3.1.2",
    "pypdf==6.11.0",
    "pgvector==0.4.2",
    "channels==4.3.2",
    "daphne==4.2.1",
    "channels-redis==4.3.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "ruff==0.15.12",
    "pytest==9.0.3",
    "hypothesis==6.152.5",
    "mypy==1.15.0",
    "django-stubs==6.0.4",
    "djangorestframework-stubs==3.16.9",
    "types-requests==2.33.0.20260508",
    "ipykernel==7.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.mypy]
strict = true
warn_return_any = true
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main", "pydantic.mypy"]
exclude = [
    "_bmad/",
    "backend/settings.py",
    ".*/admin\\.py",
]


[tool.django-stubs]
django_settings_module = "backend.settings"
django_version = "6.0"


[tool.ruff]
target-version = "py312"
fix = true
exclude = [
    ".claude",
    "_bmad",
    "*/migrations/*",
    "backend/settings.py",
]

[tool.ruff.lint]
select = ["W", "E", "F", "C", "Q", "I"]


[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests"
]
