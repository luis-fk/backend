[project]
name = "backend"
version = "4.8.0"
description = ""
authors = [{ name = "fl-korbes", email = "felipekorbes@live.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django==6.0.10",
    "gunicorn==26.0.0",
    "django-environ==0.13.0",
    "djangorestframework==3.18.3",
    "django-cors-headers==4.9.0",
    "langchain==1.5.0",
    "langchain-core==1.8.0",
    "langgraph==1.2.21",
    "langchain-text-splitters==1.1.3",
    "langchain-tavily==0.2.18",
    "tavily-python==0.7.24",
    "langchain-openai==1.7.4",
    "langchain-google-genai==4.5.0",
    "psycopg2-binary==2.9.12",
    "dj-database-url==3.1.2",
    "pypdf==6.21.4",
    "pgvector==0.4.2",
    "channels==4.3.2",
    "daphne==4.2.3",
    "channels-redis==4.3.0",
    "whitenoise>=6.12.0",
    "feedparser==6.0.14",
    "trafilatura==2.3.1",
    "googlenewsdecoder==0.2.2",
    "httpx==0.28.1",
    "aiohttp==3.14.5",
    "pyjwt==2.15.1",
]

[dependency-groups]
dev = [
    "ruff==0.15.12",
    "pytest==9.0.3",
    "hypothesis==6.152.5",
    "mypy==1.15.0",
    "django-stubs==6.0.4",
    "djangorestframework-stubs==3.16.9",
    "types-requests==2.33.0.20260508",
    "ipykernel==7.2.0",
    "pytest-django==4.14.0",
]

[tool.mypy]
strict = true
warn_return_any = true
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main", "pydantic.mypy"]
exclude = [
    ".*/admin\\.py",
]

[[tool.mypy.overrides]]
module = "backend.settings"
ignore_errors = true


[tool.django-stubs]
django_settings_module = "backend.settings"
django_version = "6.0"


[tool.ruff]
target-version = "py312"
exclude = [
    "*/migrations/*",
    "backend/settings.py",
]

[tool.ruff.lint]
select = ["W", "E", "F", "C", "Q", "I"]


[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests"
]
DJANGO_SETTINGS_MODULE = "backend.settings"
markers = [
    "access_check: runs the check that the person can still use the app, which tests/conftest.py skips elsewhere",
]
